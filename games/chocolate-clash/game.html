<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4f1e8">
  <title>巧克力對決 Chocolate Clash</title>
  <link rel="stylesheet" href="../../assets/game-shell.css?v=20260728g">
</head>
<body data-game="chocolate-clash">
  <div id="app"></div>
  <script type="module">
    await import('../../assets/game-loader.js?v=20260805b');

    const updateChocolateLinks = () => {
      document.querySelectorAll('a.info-link').forEach((link) => {
        const label = link.textContent.trim();

        if (label === 'BGG 頁面') {
          link.href = 'https://boardgamegeek.com/boardgame/410394';
        }

        if (label === '中文規則') {
          link.removeAttribute('href');
          link.removeAttribute('target');
          link.removeAttribute('rel');
          link.setAttribute('aria-disabled', 'true');
          link.setAttribute('tabindex', '-1');
          link.style.cursor = 'not-allowed';
        }
      });
    };

    updateChocolateLinks();
    new MutationObserver(updateChocolateLinks).observe(document.getElementById('app'), {
      childList: true,
      subtree: true
    });
  </script>
</body>
</html>
